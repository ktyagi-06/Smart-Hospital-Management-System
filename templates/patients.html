{% extends "base.html" %}{% block body %}
<h1>Patients</h1>
<div class="card"><h2>Register patient</h2>
<form method="post"><div class="row">
<div><label>Name *</label><input name="name" required></div>
<div><label>Age</label><input name="age" type="number" min="0" max="120"></div>
<div><label>Gender</label><select name="gender"><option>Male</option><option>Female</option><option>Other</option></select></div>
<div><label>Phone</label><input name="phone"></div>
<div><label>Blood group</label><select name="blood_group"><option></option>{% for b in ['A+','A-','B+','B-','AB+','AB-','O+','O-'] %}<option>{{b}}</option>{% endfor %}</select></div>
<div><label>Address</label><input name="address"></div>
<div><button>Register</button></div></div></form></div>
<div class="card"><form method="get" class="row" style="margin-bottom:10px"><div><input name="q" value="{{ term }}" placeholder="Search name or phone"></div><div><button class="sec">Search</button></div></form>
<table><tr><th>ID</th><th>Name</th><th>Age</th><th>Gender</th><th>Phone</th><th>Blood</th><th></th></tr>
{% for p in rows %}<tr><td>{{ p.id }}</td><td>{{ p.name }}</td><td>{{ p.age }}</td><td>{{ p.gender }}</td><td>{{ p.phone }}</td><td>{{ p.blood_group }}</td><td><a href="{{ url_for('patient_detail', pid=p.id) }}">Open</a></td></tr>
{% else %}<tr><td colspan="7" class="muted">No patients found.</td></tr>{% endfor %}</table></div>{% endblock %}
